<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PS Cyphers — Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ========== EDIT THESE ========== */
    :root {
      --bg: #000000;
      --ink: #ffffff;
      --bar-cyan: #3ec6f5;
      --bar-orange: #ff5a00;
      --bar-ink: #0a0a0a;
      --flyer-size: min(92vw, 92vh, 720px);
      --title-size: clamp(42px, 14vw, 92px);
      --date-size: clamp(36px, 12vw, 78px);
      --bar-text: clamp(15px, 4.2vw, 28px);
      --meta-text: clamp(16px, 4.6vw, 30px);
      --cta-text: clamp(13px, 3.6vw, 22px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: var(--ink);
      font-family: "Barlow Condensed", system-ui, sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    /* Square flyer canvas — change --flyer-size above to resize */
    .flyer {
      width: var(--flyer-size);
      aspect-ratio: 1 / 1;
      background: var(--bg);
      position: relative;
      display: grid;
      /* Match original flyer band proportions */
      grid-template-rows:
        1.55fr  /* title (+ room for optional decor) */
        0.55fr  /* subhead cyan */
        4.2fr   /* photo — largest band */
        0.95fr  /* date orange */
        0.55fr  /* time/city */
        0.7fr   /* venue cyan */
        0.55fr; /* CTA orange */
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }

    .block {
      width: 100%;
      min-height: 0;
    }

    /* Optional sun + palms — delete this whole .decor block to remove */
    .decor {
      position: absolute;
      top: 1.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 46%;
      height: 9%;
      z-index: 2;
      pointer-events: none;
    }
    .decor svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .title {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 10% 3% 1%;
      text-align: center;
      font-family: "Anton", Impact, sans-serif;
      font-size: var(--title-size);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink);
      filter: contrast(1.05);
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.05;
      padding: 0 4%;
    }

    .bar-cyan {
      background: var(--bar-cyan);
      color: var(--bar-ink);
      font-size: var(--bar-text);
    }

    .bar-orange {
      background: var(--bar-orange);
      color: var(--ink);
      font-family: "Anton", Impact, sans-serif;
      font-size: var(--date-size);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .bar-orange.cta {
      font-family: "Barlow Condensed", system-ui, sans-serif;
      font-size: var(--cta-text);
      font-weight: 800;
      color: var(--bar-ink);
      letter-spacing: 0.06em;
    }

    .photo {
      width: 100%;
      overflow: hidden;
      background: #0a0a12;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      display: block;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55em;
      padding: 0 4%;
      font-size: var(--meta-text);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--bg);
    }
    .meta .sep {
      color: var(--bar-orange);
      font-weight: 800;
    }

    .venue {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bar-cyan);
      color: var(--bar-ink);
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: var(--bar-text);
      line-height: 1.12;
      padding: 0 4%;
    }
    .venue span {
      display: block;
    }

    /* Edit tip strip — hide for export/screenshot */
    .edit-tip {
      position: fixed;
      left: 12px;
      bottom: 12px;
      max-width: 280px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(20, 20, 22, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d7d2c8;
      font: 500 12px/1.4 system-ui, sans-serif;
      z-index: 10;
    }
    .edit-tip strong { color: #fff; }
    @media print {
      .edit-tip { display: none; }
      body { background: #000; padding: 0; }
      .flyer { width: 100vw; box-shadow: none; }
    }
  </style>
</head>
<body>
  <!--
    EDITABLE FLYER
    Change any text below. Colors/sizes live in :root at the top.
    Delete the whole <div class="decor">...</div> to remove sun + palms.
  -->

  <article class="flyer" aria-label="PS Cyphers flyer">

    <!-- DELETE this block to remove sun + palms -->
    <div class="decor" aria-hidden="true">
      <svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
        <!-- left palm -->
        <g fill="none" stroke="#9b4dff" stroke-width="3" stroke-linecap="round">
          <path d="M70 110 C55 70, 35 45, 18 22" />
          <path d="M70 110 C48 75, 55 40, 42 18" />
          <path d="M70 110 C62 72, 78 42, 88 20" />
          <path d="M70 110 C78 78, 95 55, 112 34" />
        </g>
        <!-- right palm -->
        <g fill="none" stroke="#9b4dff" stroke-width="3" stroke-linecap="round">
          <path d="M330 110 C345 70, 365 45, 382 22" />
          <path d="M330 110 C352 75, 345 40, 358 18" />
          <path d="M330 110 C338 72, 322 42, 312 20" />
          <path d="M330 110 C322 78, 305 55, 288 34" />
        </g>
        <!-- striped sun -->
        <defs>
          <clipPath id="sun">
            <circle cx="200" cy="78" r="48" />
          </clipPath>
        </defs>
        <g clip-path="url(#sun)">
          <rect x="150" y="30" width="100" height="10" fill="#ffb000" />
          <rect x="150" y="42" width="100" height="10" fill="#ff7a00" />
          <rect x="150" y="54" width="100" height="10" fill="#ffb000" />
          <rect x="150" y="66" width="100" height="10" fill="#ff7a00" />
          <rect x="150" y="78" width="100" height="10" fill="#ffb000" />
          <rect x="150" y="90" width="100" height="10" fill="#ff7a00" />
          <rect x="150" y="102" width="100" height="10" fill="#ffb000" />
        </g>
        <circle cx="200" cy="78" r="48" fill="none" stroke="#ff7a00" stroke-width="2" opacity=".35" />
      </svg>
    </div>

    <!-- TITLE -->
    <h1 class="title block">PS CYPHERS</h1>

    <!-- SUBHEAD -->
    <div class="bar bar-cyan block">ALL STYLES DANCE CYPHER</div>

    <!-- PHOTO — swap src to change image -->
    <div class="photo">
      <img src="assets/flyer-photo.jpg" alt="Dancers in a cypher circle" />
    </div>

    <!-- DATE -->
    <div class="bar bar-orange block">DEC 11TH</div>

    <!-- TIME + CITY -->
    <div class="meta block">
      <span>6PM - 8PM</span>
      <span class="sep" aria-hidden="true">|</span>
      <span>PALM SPRINGS</span>
    </div>

    <!-- VENUE -->
    <div class="venue block">
      <span>PALM SPRINGS DANCE ACADEMY</span>
      <span>SUN CENTER</span>
    </div>

    <!-- CTA -->
    <div class="bar bar-orange cta block">LINK IN BIO TO SAVE YOUR SPOT</div>
  </article>

  <p class="edit-tip">
    <strong>Editable file:</strong> open <code>flyer.html</code> and change the text in place.
    Colors/sizes are in the <code>:root</code> block at the top.
  </p>
</body>
</html>
